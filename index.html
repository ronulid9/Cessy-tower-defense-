
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cessy Tower Defense</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10251f;color:#f5f7ef;font-family:system-ui,sans-serif}
.app{max-width:960px;margin:auto;padding:10px;display:grid;gap:10px}
header,.panel{background:#173641;border:1px solid #426875;border-radius:14px;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:21px;margin:0}
.stats{display:flex;gap:12px;font-weight:bold}
canvas{display:block;width:100%;aspect-ratio:16/9;background:#72ad4c;border:2px solid #4b8060;border-radius:12px;touch-action:manipulation}
.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
button{background:#254b59;color:white;border:1px solid #63818a;border-radius:10px;padding:11px 5px;min-height:45px;font:inherit;font-weight:bold;cursor:pointer}
button.selected{border:2px solid #ffd34d;background:#34533e}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1}
#message{min-height:24px;color:#d6ebcf;margin-top:9px}
.hint{font-size:13px;color:#bdd0d0;line-height:1.5}
#overlay{position:fixed;inset:0;background:#06130ddd;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#dialog{background:#173641;border:2px solid #6b9790;border-radius:18px;padding:25px;text-align:center;width:min(420px,100%)}
#dialog h2{font-size:30px;margin:5px}
#dialog p{line-height:1.5}
@media(max-width:480px){.app{padding:6px}.stats{font-size:14px;gap:8px}h1{font-size:18px}.controls{gap:5px}button{font-size:13px;padding:8px 3px}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>🏰 Cessy Tower Defense</h1>
<div class="stats">
<span>❤️ <b id="lives">3</b></span>
<span>🪙 <b id="coins">180</b></span>
<span>🌊 <b id="wave">0/10</b></span>
</div>
</header>

<canvas id="game" width="960" height="540"></canvas>

<section class="panel">
<div class="controls">
<button data-type="archer">🏹 Лучник<br>🪙 60</button>
<button data-type="cannon">💣 Гармата<br>🪙 95</button>
<button data-type="mage">🔮 Маг<br>🪙 110</button>
</div>
<div class="row">
<button id="start">⚔️ Почати хвилю</button>
<button id="pause">⏸ Пауза</button>
</div>
<div class="row">
<button id="upgrade" disabled>⬆️ Покращити</button>
<button id="sell" disabled>♻️ Продати</button>
<button id="restart">🔄 Спочатку</button>
</div>
<div id="message">Вибери башту та торкнися трави, щоб поставити її.</div>
<div class="hint">
🟢 Зелений ворог забирає 1 ❤️.<br>
🟡 Жовтий ворог забирає 3 ❤️.<br>
Постав башти біля дороги та не пропускай ворогів до виходу!
</div>
</section>
</div>

<div id="overlay">
<div id="dialog">
<h2 id="result">💥 Поразка!</h2>
<p id="resultText"></p>
<button id="playAgain">🔄 Зіграти ще раз</button>
</div>
</div>

<script>
(()=>{
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const W=960,H=540;
const path=[[-20,185],[285,185],[330,220],[330,390],[510,390],[545,350],[545,225],[710,225],[750,260],[750,350],[980,350]];
const defs={
 archer:{name:'Лучник',cost:60,range:135,damage:18,rate:.65,color:'#f3b15e',emoji:'🏹'},
 cannon:{name:'Гармата',cost:95,range:155,damage:42,rate:1.2,color:'#aab6c3',emoji:'💣'},
 mage:{name:'Маг',cost:110,range:145,damage:28,rate:.8,color:'#a99aff',emoji:'🔮'}
};
let coins,lives,wave,selectedType,selectedTower,enemies,towers,shots;
let active,paused,gameOver,spawnLeft,spawnTimer,last,elapsed;

const $=id=>document.getElementById(id);
const buttons=[...document.querySelectorAll('[data-type]')];

function reset(){
 coins=180;lives=3;wave=0;selectedType=null;selectedTower=null;
 enemies=[];towers=[];shots=[];active=false;paused=false;
 gameOver=false;spawnLeft=0;spawnTimer=0;last=0;elapsed=0;
 $('overlay').style.display='none';
 $('pause').textContent='⏸ Пауза';
 ui('Вибери башту та торкнися трави, щоб поставити її.');
}
function ui(message){
 $('lives').textContent=lives;
 $('coins').textContent=coins;
 $('wave').textContent=wave+'/10';
 $('message').textContent=message;
 buttons.forEach(b=>b.classList.toggle('selected',b.dataset.type===selectedType));
 $('upgrade').disabled=!selectedTower||coins<upgradeCost(selectedTower)||gameOver;
 $('sell').disabled=!selectedTower||gameOver;
 $('upgrade').textContent=selectedTower?'⬆️ Покращити ('+upgradeCost(selectedTower)+')':'⬆️ Покращити';
}
function upgradeCost(t){return 45+t.level*35}
function pointAt(distance){
 for(let i=1;i<path.length;i++){
  const [x1,y1]=path[i-1],[x2,y2]=path[i];
  const len=Math.hypot(x2-x1,y2-y1);
  if(distance<=len){
   const f=distance/len;
   return{x:x1+(x2-x1)*f,y:y1+(y2-y1)*f};
  }
  distance-=len;
 }
 return{x:980,y:350};
}
const pathLength=path.slice(1).reduce((sum,p,i)=>sum+Math.hypot(p[0]-path[i][0],p[1]-path[i][1]),0);
function nearPath(x,y){
 for(let i=1;i<path.length;i++){
  const [x1,y1]=path[i-1],[x2,y2]=path[i];
  const dx=x2-x1,dy=y2-y1;
  const f=Math.max(0,Math.min(1,((x-x1)*dx+(y-y1)*dy)/(dx*dx+dy*dy)));
  if(Math.hypot(x-(x1+f*dx),y-(y1+f*dy))<52)return true;
 }
 return false;
}
function placeTower(x,y){
 if(!selectedType)return;
 const d=defs[selectedType];
 if(coins<d.cost){ui('Не вистачає монет!');return}
 if(nearPath(x,y)||x<30||x>930||y<30||y>510||
 towers.some(t=>Math.hypot(t.x-x,t.y-y)<44)){
  ui('Обери вільне місце на траві біля дороги.');return;
 }
 coins-=d.cost;
 towers.push({...d,type:selectedType,x,y,level:1,cool:0,cost:d.cost});
 selectedTower=towers[towers.length-1];
 ui(d.name+' побудовано!');
}
function startWave(){
 if(gameOver){reset();return}
 if(active){ui('Хвиля вже триває!');return}
 if(wave>=10){
  finish(true);return;
 }
 wave++;
 active=true;
 spawnLeft=7+wave*2;
 spawnTimer=.3;
 ui('Хвиля '+wave+' почалася!');
}
function spawnEnemy(){
 const yellow=(wave>=2 && Math.random()<.28);
 const boss=wave===5&&spawnLeft===1;
 const hp=boss?550:(yellow?100+wave*12:48+wave*9);
 enemies.push({
  progress:0,
  hp,maxHp:hp,
  speed:boss?27:(yellow?43:51)+wave,
  color:boss?'#b72d52':yellow?'#e6c542':'#4e9c45',
  damage:boss?3:yellow?3:1,
  reward:boss?100:(yellow?12:7),
  boss
 });
}
function finish(win){
 gameOver=true;active=false;
 $('overlay').style.display='flex';
 $('result').textContent=win?'🏆 Перемога!':'💥 Поразка!';
 $('resultText').textContent=win?
 'Ти захистив базу в усіх 10 хвилях!':
 'Здоров’я бази закінчилося. Спробуй іншу стратегію оборони!';
 ui(win?'Усі хвилі пройдено!':'Базу знищено!');
}
function update(dt){
 if(paused||gameOver)return;
 elapsed+=dt;
 if(active&&spawnLeft>0){
  spawnTimer-=dt;
  if(spawnTimer<=0){
   spawnEnemy();spawnLeft--;
   spawnTimer=Math.max(.48,1.15-wave*.045);
  }
 }
 for(const e of enemies)e.progress+=e.speed*dt;
 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];
  if(e.progress>=pathLength){
   lives-=e.damage;
   burst(920,350,e.color,10);
   enemies.splice(i,1);
   if(lives<=0){lives=0;ui('База втратила все здоров’я!');finish(false);return}
   ui('Ворог прорвався! База втратила '+e.damage+' ❤️.');
  }
 }
 for(const t of towers){
  t.cool-=dt;
  if(t.cool<=0){
   let target=null,best=-1;
   for(const e of enemies){
    const p=pointAt(e.progress);
    const dist=Math.hypot(p.x-t.x,p.y-t.y);
    if(dist<=t.range&&e.progress>best){best=e.progress;target=e}
   }
   if(target){
    t.cool=t.rate/(1+(t.level-1)*.13);
    shots.push({tower:t,target,progress:0,speed:430});
   }
  }
 }
 for(let i=shots.length-1;i>=0;i--){
  const s=shots[i];s.progress+=dt*s.speed;
  const p=pointAt(s.target.progress);
  if(s.target.hp<=0){shots.splice(i,1);continue}
  const d=Math.hypot(p.x-s.tower.x,p.y-s.tower.y);
  if(s.progress>=d){
   s.target.hp-=s.tower.damage;
   burst(p.x,p.y,s.tower.color,4);
   if(s.target.hp<=0){
    coins+=s.target.reward;
    burst(p.x,p.y,s.target.color,12);
    enemies=enemies.filter(e=>e!==s.target);
   }
   shots.splice(i,1);
  }
 }
 if(active&&spawnLeft===0&&enemies.length===0&&shots.length===0){
  active=false;
  if(wave===10){finish(true);return}
  ui('Хвилю '+wave+' відбито! Можеш підготувати оборону.');
 }
 ui();
}
function burst(x,y,color,count){
 for(let i=0;i<count;i++){
  const a=Math.random()*Math.PI*2,v=35+Math.random()*100;
  particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.4,color});
 }
}
let particles=[];
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#72ad4c';ctx.fillRect(0,0,W,H);
 for(let i=0;i<130;i++){
  const x=(i*137+37)%W,y=(i*83+19)%H;
  ctx.fillStyle=i%2?'#5d9940':'#84bc58';
  ctx.fillRect(x,y,3,3);
 }
 ctx.lineCap='round';ctx.lineJoin='round';
 ctx.strokeStyle='#8c653d';ctx.lineWidth=91;
 ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();
 ctx.strokeStyle='#d8b578';ctx.lineWidth=79;
 ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();
 ctx.fillStyle='#68482b';ctx.fillRect(906,304,22,94);
 ctx.fillStyle='#d6ae6c';ctx.fillRect(912,311,9,79);
 for(const t of towers){
  if(t===selectedTower){
   ctx.strokeStyle='#fff08a';ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(t.x,t.y,t.range,0,Math.PI*2);ctx.stroke();
  }
  ctx.fillStyle='#425552';ctx.beginPath();ctx.arc(t.x,t.y,23,0,7);ctx.fill();
  ctx.fillStyle=t.color;ctx.fillRect(t.x-14,t.y-15,28,29);
  ctx.font='24px sans-serif';ctx.textAlign='center';
  ctx.fillText(t.emoji,t.x,t.y-19);
  ctx.fillStyle='#172d2c';ctx.fillRect(t.x-15,t.y+18,30,5);
  ctx.fillStyle='#ffd34d';ctx.fillRect(t.x-15,t.y+18,30*Math.min(1,t.level/4),5);
 }
 for(const e of enemies){
  const p=pointAt(e.progress);
  ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(p.x,p.y,e.boss?20:13,0,7);ctx.fill();
  ctx.fillStyle='white';
  ctx.beginPath();ctx.arc(p.x-4,p.y-3,2.5,0,7);ctx.arc(p.x+4,p.y-3,2.5,0,7);ctx.fill();
  ctx.fillStyle='#4b2725';ctx.fillRect(p.x-15,p.y-23,30,5);
  ctx.fillStyle='#ff6458';ctx.fillRect(p.x-15,p.y-23,30*Math.max(0,e.hp/e.maxHp),5);
  if(e.boss){ctx.fillStyle='white';ctx.font='bold 12px sans-serif';ctx.fillText('БОС',p.x,p.y-29)}
 }
 for(const s of shots){
  const p=pointAt(Math.min(s.target.progress,s.target.progress));
  const start={x:s.tower.x,y:s.tower.y};
  const end={x:p.x,y:p.y};
  const dist=Math.hypot(end.x-start.x,end.y-start.y);
  const f=Math.min(1,s.progress/Math.max(1,dist));
  ctx.fillStyle=s.tower.color;
  ctx.beginPath();ctx.arc(start.x+(end.x-start.x)*f,start.y+(end.y-start.y)*f,5,0,7);ctx.fill();
 }
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.life-=.016;p.x+=p.vx*.016;p.y+=p.vy*.016;
  if(p.life<=0){particles.splice(i,1);continue}
  ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();
 }
 ctx.globalAlpha=1;
 if(!active&&!gameOver){
  ctx.fillStyle='#10251ecc';ctx.fillRect(315,17,330,40);
  ctx.fillStyle='white';ctx.font='bold 19px sans-serif';ctx.textAlign='center';
  ctx.fillText(wave===0?'Підготуй оборону!':'Хвиля відбита!',480,44);
 }
}
function frame(time){
 const dt=last?Math.min((time-last)/1000,.04):0;
 last=time;
 if(!paused&&!gameOver)update(dt);
 draw();
 requestAnimationFrame(frame);
}
function coords(ev){
 const r=canvas.getBoundingClientRect();
 return{x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height};
}
canvas.addEventListener('pointerdown',ev=>{
 const {x,y}=coords(ev);
 let tower=towers.find(t=>Math.hypot(t.x-x,t.y-y)<28);
 if(tower){selectedTower=tower;selectedType=null;ui('Обрано: '+tower.name+'.');return}
 if(selectedType){placeTower(x,y);return}
 selectedTower=null;ui('Вибери башту, щоб побудувати її.');
});
buttons.forEach(b=>b.addEventListener('click',()=>{
 selectedType=b.dataset.type;selectedTower=null;
 ui('Тепер торкнися вільного місця на траві.');
}));
$('start').addEventListener('click',startWave);
$('pause').addEventListener('click',()=>{
 if(gameOver)return;
 paused=!paused;
 $('pause').textContent=paused?'▶️ Продовжити':'⏸ Пауза';
 ui(paused?'Гру призупинено.':'Гру продовжено.');
});
$('restart').addEventListener('click',reset);
$('playAgain').addEventListener('click',reset);
$('upgrade').addEventListener('click',()=>{
 if(!selectedTower)return;
 const cost=upgradeCost(selectedTower);
 if(coins<cost)return;
 coins-=cost;selectedTower.level++;
 selectedTower.damage=Math.round(selectedTower.damage*1.4);
 selectedTower.range+=8;
 ui('Башту покращено до рівня '+selectedTower.level+'!');
});
$('sell').addEventListener('click',()=>{
 if(!selectedTower)return;
 coins+=Math.floor(selectedTower.cost*.6);
 towers=towers.filter(t=>t!==selectedTower);
 selectedTower=null;ui('Башту продано.');
});
reset();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
